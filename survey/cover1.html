<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>封面1-大字报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#e5e5e5}
  .cover{
    width:1080px;height:1440px;background:#0f0f1a;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    position:relative;overflow:hidden
  }
  .dot{
    position:absolute;border-radius:50%;background:rgba(255,255,255,0.06)
  }
  .content{position:relative;z-index:2;text-align:center;padding:0 80px}
  .main{font-size:120px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:0.03em}
  .main span{color:#f5a623}
  .sub{font-size:36px;color:rgba(255,255,255,0.35);margin-top:40px;letter-spacing:0.08em}
</style>
</head>
<body>
<div class="cover">
  <div class="dot" style="width:300px;height:300px;top:-80px;right:-60px"></div>
  <div class="dot" style="width:200px;height:200px;bottom:300px;left:-40px"></div>
  <div class="dot" style="width:150px;height:150px;bottom:120px;right:80px"></div>
  <div class="dot" style="width:100px;height:100px;top:400px;left:100px"></div>
  <div class="content">
    <div class="main">你的灵感<br>后来<span>去哪了</span></div>
    <div class="sub">一个问卷 · 点进来填</div>
  </div>
</div>
</body>
</html>
