<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面图 - 灵感碎片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e5e5e5;
  }
  .cover {
    width: 1080px;
    height: 1440px;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  /* 背景光斑 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
  }
  .glow-1 { width: 400px; height: 400px; background: #6c63ff; top: -100px; right: -100px; }
  .glow-2 { width: 300px; height: 300px; background: #f5a623; bottom: 200px; left: -80px; }
  .glow-3 { width: 250px; height: 250px; background: #4da6ff; bottom: -50px; right: 100px; }
  /* 文字 */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .emoji {
    font-size: 120px;
    margin-bottom: 40px;
    animation: float 3s ease-in-out infinite;
  }
  .main-title {
    font-size: 96px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.3;
    letter-spacing: 0.02em;
  }
  .main-title .highlight {
    color: #f5a623;
  }
  .subtitle {
    font-size: 42px;
    color: rgba(255,255,255,0.5);
    margin-top: 36px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #f5a623;
    margin: 40px auto;
    border-radius: 2px;
  }
  .cta {
    font-size: 32px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.08em;
  }
  /* 底部小字 */
  .footer {
    position: absolute;
    bottom: 80px;
    font-size: 28px;
    color: rgba(255,255,255,0.2);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
</style>
</head>
<body>
<div class="cover">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="content">
    <div class="emoji">💡</div>
    <h1 class="main-title">
      你那些灵感<br>
      后来都<span class="highlight">去哪了</span>？
    </h1>
    <div class="divider"></div>
    <p class="subtitle">来聊聊 · 问卷在正文</p>
  </div>

  <div class="footer">灵感社交平台 用户调研</div>
</div>
</body>
</html>
